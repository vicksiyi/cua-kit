[package]
name = "core-runtime-supervisor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
http = "=1.4.0"
base64 = "=0.22.1"
serde_json = "=1.0.149"
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
uuid = { version = "=1.22.0", features = ["v4"] }
libc = "0.2"
toml = "=0.9.11"
percent-encoding = "=2.3.2"
url = "=2.5.8"
rmcp = { version = "=1.5.0", features = ["server", "transport-io", "elicitation"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
sentry-core = { version = "=0.49.2", default-features = false, features = ["client"] }
